name: Readability checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install check dependencies (no model downloads)
        run: python -m pip install ruff==0.16.10
      - name: Lint changed modules
        run: ruff check gradio_common.py gradio_app.py gradio_app_long.py gradio_app_voicedesign.py tests/test_gradio_common.py
      - name: Check formatting
        run: ruff format --check gradio_common.py tests/test_gradio_common.py
      - name: Compile Python sources
        run: python -m compileall -q gradio_common.py gradio_app.py gradio_app_long.py gradio_app_voicedesign.py tests
      - name: Regression tests
        run: python -m unittest discover -s tests -v
